name: 예약 게시

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 확인 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '올라갈 목록만 보기 (true/false)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/post.py --dry-run
          else
            python scripts/post.py
          fi
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "gujo-bot"
          git config user.email "gujo-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "게시 기록" && git pull --rebase && git push)
