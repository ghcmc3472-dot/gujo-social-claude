name: 띠별 오늘

on:
  schedule:
    - cron: '40 21 * * *'   # 매일 한국 06:40에 만들기 시작 → 07:30 정각에 게시
  push:
    paths: ['dryrun/request.txt']   # 이 파일에 날짜를 적어 올리면 시험 렌더(게시 없음)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '만들기만 하고 올리지 않기 (true/false). 영상은 Artifacts에서 받기'
        default: 'true'
      date:
        description: '날짜 (비우면 오늘, 예: 2026-10-07)'
        default: ''

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    if: ${{ vars.DAILY == 'on' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - name: 글꼴·도구
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          fc-cache -f > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          npm install -g @anthropic-ai/claude-code > /dev/null
      - name: 만들고 올리기
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DAILY_MODEL: ${{ vars.DAILY_MODEL }}
          DAILY_MUSIC_QUERIES: ${{ vars.DAILY_MUSIC_QUERIES }}
          DAILY_POST_AT: ${{ vars.DAILY_POST_AT }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --now"; fi
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="--date $(head -1 dryrun/request.txt) --dry-run --now"; fi
          python scripts/daily_run.py $ARGS
      - name: 시험 결과를 dryrun-out 가지에 올리기
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          mkdir -p /tmp/out && cp posts/daily/*.mp4 dryrun/out/* /tmp/out/ 2>/dev/null || true
          git config user.name "gujo-bot"
          git config user.email "gujo-bot@users.noreply.github.com"
          git checkout -q --orphan dryrun-out && git rm -rqf . && git clean -fdxq && cp /tmp/out/* . 2>/dev/null || true
          git add -A && git commit -qm "시험 렌더" && git push -qf origin dryrun-out
      - name: 시험 영상 받기
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel
          path: posts/daily/*.mp4
      - name: 기록 저장
        if: always() && github.event.inputs.dry_run != 'true' && github.event_name != 'push'
        run: |
          git config user.name "gujo-bot"
          git config user.email "gujo-bot@users.noreply.github.com"
          git add state/daily_history.json posts/daily 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "띠별 오늘 기록" && git pull --rebase && git push)
